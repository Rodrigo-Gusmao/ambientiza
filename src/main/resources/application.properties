ambientiza.admin.email=${ADMIN_EMAIL:admin@ambientiza.com}
ambientiza.admin.senha=${ADMIN_SENHA:admin123}
# Cria tarefas, recompensas, quiz e o usuario demo (arthur@ambientiza.com / 123456)
ambientiza.seed.demo=${SEED_DEMO:true}